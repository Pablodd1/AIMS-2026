name: Jev System-1 Web Error Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Base URL to audit (leave empty for default)'
        required: false
        default: ''

jobs:
  jev-audit:
    name: Jev-1 Route & Error Classification Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: ${{ github.event.inputs.target_url || vars.BASE_URL || secrets.BASE_URL || 'http://localhost:4000' }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL || secrets.NOTIFICATION_EMAIL || 'devops@aimsclinic.com' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify Build Gates
        run: npm run build

      - name: Execute Jev System-1 Error Monitor Audit
        run: node scripts/jev-audit.mjs
